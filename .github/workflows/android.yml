name: Build BookFlow APK
on:
  push:
    branches: [bookflow-android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BookFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bookflow-study-v2
          name: BookFlow Study Edition
          body: "BookFlow study build. Debug APK for Android testing."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
